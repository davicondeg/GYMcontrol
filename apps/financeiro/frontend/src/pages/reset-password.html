<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor Financeiro | Redefinir senha</title>
    <meta
      name="description"
      content="Tela de redefinição de senha do Gestor Financeiro para usuários que receberam o link de recuperação por e-mail."
    >
    <link rel="stylesheet" href="../styles/login.css">
  </head>
  <body>
    <div class="watermark" aria-hidden="true">
      <svg viewBox="0 0 1440 900" preserveAspectRatio="none">
        <defs>
          <linearGradient id="wmLineRecovery" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1A365D" stop-opacity="0.12"></stop>
            <stop offset="100%" stop-color="#1DB954" stop-opacity="0.14"></stop>
          </linearGradient>
        </defs>
        <path
          d="M-40 720 C 160 640, 260 700, 420 620 S 720 500, 900 560 S 1180 460, 1480 260"
          fill="none"
          stroke="url(#wmLineRecovery)"
          stroke-width="3"
        ></path>
        <path
          d="M40 780 C 220 700, 360 760, 520 680 S 820 540, 1000 620 S 1260 540, 1460 360"
          fill="none"
          stroke="#1A365D"
          stroke-opacity="0.06"
          stroke-width="2"
        ></path>
        <g fill="#1A365D" fill-opacity="0.1">
          <circle cx="190" cy="676" r="6"></circle>
          <circle cx="420" cy="620" r="6"></circle>
          <circle cx="730" cy="512" r="6"></circle>
          <circle cx="930" cy="552" r="6"></circle>
          <circle cx="1170" cy="458" r="6"></circle>
          <circle cx="420" cy="680" r="5"></circle>
          <circle cx="760" cy="590" r="5"></circle>
          <circle cx="1010" cy="612" r="5"></circle>
        </g>
        <g fill="none" stroke="#1A365D" stroke-opacity="0.08" stroke-width="1.5">
          <path d="M190 676 L420 620 L730 512 L930 552 L1170 458"></path>
          <path d="M420 680 L760 590 L1010 612"></path>
        </g>
      </svg>
    </div>

    <main class="page-shell">
      <section class="login-card" aria-labelledby="recovery-title">
        <header class="brand-header">
          <div class="brand-lockup" aria-label="Gestor Financeiro">
            <div class="brand-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <rect x="8" y="34" width="10" height="16" rx="2"></rect>
                <rect x="22" y="26" width="10" height="24" rx="2"></rect>
                <rect x="36" y="18" width="10" height="32" rx="2"></rect>
                <path d="M13 30 L25 22 L37 26 L51 11" fill="none"></path>
                <path d="M51 11 L46 12 L49 16" fill="none"></path>
              </svg>
            </div>
            <div class="brand-text">
              <h1>Gestor Financeiro</h1>
              <p>SISTEMA DE GESTÃO DE DESPESAS</p>
            </div>
          </div>
          <p class="welcome-text" id="recovery-title">Redefinir senha</p>
        </header>

        <section class="signup-header" id="recovery-waiting-state">
          <p class="section-kicker">Recuperação de acesso</p>
          <h2>Abra o link de recuperação</h2>
          <p>
            Esta tela só libera a troca de senha depois que você abrir o link enviado por e-mail.
          </p>
          <nav class="aux-links" aria-label="Navegação de recuperação">
            <a href="./login.html">Voltar ao login</a>
          </nav>
        </section>

        <p class="form-feedback" id="recovery-feedback" aria-live="polite"></p>

        <form id="recovery-form" class="signup-form" hidden novalidate>
          <div class="field-group">
            <label for="new-password">Nova senha</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M17 10h-1V8a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2Zm-3 0h-4V8a2 2 0 0 1 4 0Z"></path>
                </svg>
              </span>
              <input
                id="new-password"
                name="newPassword"
                type="password"
                placeholder="••••••••"
                minlength="6"
                autocomplete="new-password"
                required
              >
            </div>
          </div>

          <div class="field-group">
            <label for="confirm-new-password">Confirmar nova senha</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M17 10h-1V8a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2Zm-3 0h-4V8a2 2 0 0 1 4 0Z"></path>
                </svg>
              </span>
              <input
                id="confirm-new-password"
                name="confirmNewPassword"
                type="password"
                placeholder="••••••••"
                minlength="6"
                autocomplete="new-password"
                required
              >
            </div>
          </div>

          <p class="form-feedback" id="recovery-form-feedback" aria-live="polite"></p>

          <button class="submit-button submit-button--signup" id="recovery-submit-button" type="submit">
            Atualizar senha
          </button>
          <button class="ghost-button" id="back-to-login-recovery" type="button">Voltar ao login</button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../services/supabaseClient.js"></script>
    <script src="../services/authService.js"></script>
    <script src="../scripts/reset-password.js"></script>
  </body>
</html>
