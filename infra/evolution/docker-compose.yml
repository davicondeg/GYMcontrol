services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: jhonny_evolution_api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - jhonny-evolution

  evolution-postgres:
    image: postgres:15-alpine
    container_name: jhonny_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - jhonny-evolution

  evolution-redis:
    image: redis:7-alpine
    container_name: jhonny_evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - jhonny-evolution

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  jhonny-evolution:
    name: jhonny-evolution
